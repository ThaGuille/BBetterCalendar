# Contrato del repo para el toolkit AI-kit (schema: AI-kit/schema/profile.schema.json).
# big-task y review-branch leen la copia COMMITEADA en la rama base: un cambio aquí cuenta desde que está en main.
language: java
build: "./gradlew.bat assembleDebug"
test: "./gradlew.bat testDebugUnitTest"
docs:
  root: .claude/docs/
capabilities: [code-auditing]

bigTask:
  # 3 unidades a la vez (31 GB, 16 CPU): cada una con su daemon de Gradle (~1,5-2 GB) y su Emulator Suite (~1,5 GB);
  # slots: 2 limita los builds pesados simultáneos. Las que manejan el AVD declaran @emulator en touches y nunca
  # coinciden; el lease lo da .claude/scripts/emulator-lease.ps1.
  parallel: 3
  slots: 2
  slotCommands: [gradlew, gradle]
  # @fbemu: cada unidad arranca su propio Emulator Suite en un bloque de puertos libre (firebase/scripts/run-tests.sh
  # --block auto), así que hasta 3 lo usan a la vez. @emulator es el único AVD api36: una unidad cada vez.
  resources:
    fbemu: 3
    emulator: 1
  # Reglas para el planificador de big-task (las copia en su brief y en las constraints del plan).
  planNotes:
    - "La suite de Firebase se corre siempre con bash firebase/scripts/run-tests.sh (JDK 21, bloque de puertos libre). Tope de 300 s por intento que mata el árbol de procesos; como mucho un reintento, solo para fallos conocidos del emulador y nunca tras un tope; npm ci y tsc corren fuera del tope. Peor caso ~900 s (3 × el tope) más npm ci y tsc: el timeout del check, mayor. Un check de Firebase es {cmd: 'bash firebase/scripts/run-tests.sh', expect: '<N> passing'}, o con --only firestore,database si solo toca reglas; nunca firebase emulators:exec a mano. Declara @fbemu en touches."
    - "Solo una unidad cuyos checks manejan la UI en el AVD declara @emulator. Reutiliza el api36 si ya está arrancado (adb devices); si no, lo arranca desde su snapshot; -no-snapshot solo si el check necesita un arranque limpio. Las unidades de reglas, Functions o lógica Java no lo declaran."
    - "Notas por unidad (D-029): cada unidad escribe su nota y su línea de diario en .claude/plans/social-fN/notes/uN.md y pone solo ese fichero en touches. Nunca pongas el plan de fase (.claude/plans/social-fN-*.md) ni el tablero (.claude/plans/sistema-social.md) en los touches de una unidad que no sea la de cierre: eso pone en fila todas las unidades."
    - "Usa workMode unit-worktrees y deps solo para 'necesita el resultado de': las unidades de reglas/Functions (firebase/**), de datos Java (app/src/main/java/.../social/**) y de UI (ui/social/**, res/**) suelen poder ir a la vez si no comparten ficheros. app/build.gradle es un fichero compartido: junta en una sola unidad los cambios de dependencias."
    - "Gradle tiene build cache y configuration cache (gradle.properties): una worktree nueva compila en ~35 s; no hace falta un paso de calentamiento antes del primer check."
    - "Un check de mutación que cuenta mutantes declara los equivalentes con bt equivalent (con la salida que lo prueba) en vez de bloquear la unidad; no pongas en el check un mutante que el emulador rechaza antes de evaluar las reglas (p. ej. ids reservados __x__)."

  # Sin local.properties una worktree nueva depende de ANDROID_HOME; con él compila igual que el checkout.
  worktreeCopy: [local.properties]
  forbid:
    - match: '\bpm\s+clear\b'
      why: "borra la base de datos Room de la app en el emulador; para resetear un flujo, run-as rm del fichero de SharedPreferences concreto"
    - match: 'firebaseEmulator=false'
      why: "crearía usuarios reales en el proyecto Firebase; las fases sociales se prueban contra el Emulator Suite (D-021)"
    - match: '\bfirebase\s+deploy\b'
      why: "desplegar reglas o funciones es una decisión del usuario, nunca de una unidad"

review:
  rules: [CLAUDE.md, .claude/docs/style_guide.md, .claude/docs/architectural_patterns.md]
  codemap: .claude/docs/architecture.md
  gate: "./gradlew.bat assembleDebug testDebugUnitTest"
  paths:
    guards: [".claude/hooks/**", ".claude/settings*.json", ".github/workflows/**", "firebase/firestore.rules", "firebase/database.rules.json"]
    keys: ["app/google-services.json", "firebase/firebase.json", "app/build.gradle"]
    migration: ["app/src/main/java/com/example/bbettercalendar/database/**", "app/schemas/**"]
    docs: ["docs/**", "**/*.md", ".claude/plans/**"]
  pushGate:
    mode: once
    minLines: 40
