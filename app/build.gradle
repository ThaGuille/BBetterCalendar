plugins {
    id 'com.android.application'
    id 'dagger.hilt.android.plugin'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

// Clave de subida (upload key) para builds de release firmadas. keystore.properties NO se versiona
// (.gitignore); si falta (CI, otra máquina, clon limpio) assembleRelease sale SIN firmar en vez de
// romper el build. La clave privada nunca entra al repo. Genera el keystore con el comando de
// docs/legal/play-release-guide.md §Firma.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.example.bbettercalendar'
    compileSdk 36

    defaultConfig {
        // OJO: applicationId es PERMANENTE tras la 1ª subida a Play; no puede cambiarse nunca más.
        // namespace se queda en com.example.bbettercalendar a propósito -> los paquetes Java, la clase
        // R y el codegen de Hilt/Room no se mueven. (Phase 4b)
        applicationId "io.github.thaguille.bbettercalendar"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            // u11 (migración visual): bloques sociales con datos falsos (MockSocialRepository).
            // Solo debug; en release los bloques sociales desaparecen (SocialFeature.isEnabled()).
            buildConfigField "boolean", "FEATURE_SOCIAL_MOCK", "true"
            // F0-u4: backend social. FEATURE_SOCIAL no tiene efecto hasta que exista el repositorio real
            // (F4); USE_FIREBASE_EMULATOR apunta Firebase al Emulator Suite del PC (10.0.2.2). Para usar el
            // proyecto real desde debug: .\gradlew.bat assembleDebug -PfirebaseEmulator=false
            buildConfigField "boolean", "FEATURE_SOCIAL", "true"
            buildConfigField "boolean", "USE_FIREBASE_EMULATOR",
                    (project.findProperty("firebaseEmulator") ?: "true").toString()
        }
        release {
            buildConfigField "boolean", "FEATURE_SOCIAL_MOCK", "false"
            buildConfigField "boolean", "FEATURE_SOCIAL", "false"
            buildConfigField "boolean", "USE_FIREBASE_EMULATOR", "false"
            // minifyEnabled se queda en false para la 1ª release: Hilt/Room/Gson usan reflexión y las
            // reglas ProGuard no están probadas. Revisar más adelante para reducir el tamaño del APK.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Firma sólo si hay keystore.properties; si no, release sale sin firmar (no rompe el build).
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        // AGP 8 ya no genera BuildConfig por defecto; hace falta para FEATURE_SOCIAL_MOCK (u11).
        buildConfig true
    }
    viewBinding {
        enabled = true
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.6.1'
    //No actualitzar a la 1.7.0, petarà
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
    // u14: ProcessLifecycleOwner — la gracia por segundo plano mira la APP entera, no MainActivity.
    implementation 'androidx.lifecycle:lifecycle-process:2.5.1'
    implementation 'androidx.navigation:navigation-fragment:2.5.3'
    implementation 'androidx.navigation:navigation-ui:2.5.3'
    testImplementation 'junit:junit:4.13.2'
    // F2-u1: mocks de las interfaces propias (ListenerSource, Sink…) en los tests de social/. 4.11.0 es la
    // última línea que corre con Java 8; la 5.x pide Java 11. Sin Robolectric: nada de clases de Android.
    testImplementation 'org.mockito:mockito-core:4.11.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // Para el tema de @Inject
    implementation 'com.google.dagger:hilt-android:2.51.1'
    annotationProcessor "com.google.dagger:hilt-android-compiler:2.51.1"

    // @HiltViewModel (spec di-threading-consolidation): trae la anotación (androidx.hilt:hilt-common,
    // transitiva) y el codegen del factory por defecto que ViewModelProvider(this/requireActivity)
    // ya resuelve solo en un Fragment/Activity @AndroidEntryPoint -- sin esto @HiltViewModel no compila.
    implementation 'androidx.hilt:hilt-navigation-fragment:1.2.0'
    annotationProcessor 'androidx.hilt:hilt-compiler:1.2.0'

    implementation "androidx.room:room-runtime:2.6.1"
    annotationProcessor "androidx.room:room-compiler:2.6.1"

    // Transformación JSON
    implementation 'com.google.code.gson:gson:2.9.1'

    // Java 8+ APIs (java.time) on minSdk 21
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.1.5'

    // Calendario mensual (kizitonwose) — 2.5.4 mantiene compileSdk 33 (fallback per plan R1)
    implementation 'com.kizitonwose.calendar:view:2.5.4'

    // Gráficos de Progress (Phase 1). Apache-2.0, vía JitPack (ver settings.gradle).
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // Carrusel de gráficos (ViewPager2 + dots vía TabLayoutMediator de Material)
    implementation 'androidx.viewpager2:viewpager2:1.0.0'

    // F0-u4: Firebase (sistema social). BoM 35: sin sufijo -ktx (somos Java). Credential Manager: ver F1-u2 abajo.
    implementation platform('com.google.firebase:firebase-bom:35.0.2')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-functions'

    // F1-u2: Credential Manager + Iniciar sesión con Google (selector de cuentas)
    implementation 'androidx.credentials:credentials:1.5.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'

}